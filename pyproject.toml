[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8.0,<1.0"]

[dependency-groups]
dev = [{include-group = "lint"}, {include-group = "test"}, {include-group = "typecheck"}]
lint = ["pre-commit", "ruff"]
test = ["aiohttp", "pytest", "pytest-asyncio"]
typecheck = ["aiohttp", "pyright"]

[project]
authors = [{name = "Bryce Boe", email = "bbzbryce@gmail.com"}]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = []
description = "A python module that will check for package updates."
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
name = "update_checker"
readme = "README.md"
requires-python = ">=3.10"
version = "0.18.0"

[project.optional-dependencies]
async = ["aiohttp"]

[project.urls]
Changelog = "https://github.com/bboe/update_checker/blob/main/CHANGELOG.md"
Homepage = "https://github.com/bboe/update_checker"
Issues = "https://github.com/bboe/update_checker/issues"
Source = "https://github.com/bboe/update_checker"

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # this project does not use copyright notices
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D103",  # test functions do not need docstrings
    "INP001",  # the tests directory is intentionally not a package
    "PLC2701",  # tests may exercise private helpers
    "PLR2004",  # magic values are expected in test assertions
    "S101",  # pytest relies on assert
]
